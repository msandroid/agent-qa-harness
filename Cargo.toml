[package]
name = "agent-qa-harness"
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
description = "Bounded, concurrent, evidence-first QA MCP runtime"
license = "MIT"
repository = "https://github.com/msandroid/agent-qa-harness"
default-run = "agent-qa"
include = ["/Cargo.toml", "/Cargo.lock", "/src/*.rs", "/src/tools.json", "/tests/*.rs", "/skills/**", "/docs/**", "/assets/**", "/examples/**", "/README*.md", "/LICENSE", "/.mcp.json", "/mcp.json", "/mcp_config.json", "/.codex-plugin/*.json", "/.claude-plugin/*.json", "/.cursor-plugin/*.json", "/.antigravity-plugin/*.json"]

[[bin]]
name = "agent-qa"
path = "src/main.rs"

[dependencies]
anyhow = "1"
base64 = "0.22"
clap = { version = "4.5", features = ["derive", "env"] }
futures-util = { version = "0.3", features = ["sink"] }
jsonschema = { version = "0.38", default-features = false }
rmcp = { version = "3.8", default-features = false, features = ["server", "transport-io"] }
rusqlite = { version = "0.34", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "io-util", "sync", "time", "process", "fs", "net", "signal"] }
tokio-tungstenite = "0.29"
url = "2"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
