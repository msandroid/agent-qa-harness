[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "agent-qa-harness"
version = "0.1.1"
description = "Evidence-first QA workflows for frontier-model coding agents over MCP."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "msandroid"}]
dependencies = ["mcp>=1.26,<2", "pydantic>=2.12,<3"]

[project.optional-dependencies]
browser = ["playwright>=1.61,<2"]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "PyYAML>=6,<7", "ruff>=0.12,<1"]

[project.scripts]
agent-qa = "agent_qa.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_qa"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["browser: needs a local Chromium installation"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]

